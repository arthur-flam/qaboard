name: Continuous Integration

on:
  push:
  # push:
  #   branches: [ develop ]
  # pull_request:
  #   branches: [ develop ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: [ self-hosted, linux]

    steps:
    - uses: actions/checkout@v2

    - name: Configure
      working-directory: ${{github.workspace}}/CIS
      run: cmake -B ${{github.workspace}}/build/${{env.BUILD_TYPE}} -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      working-directory: ${{github.workspace}}/CIS
      run: cmake --build ${{github.workspace}}/build/${{env.BUILD_TYPE}} --config ${{env.BUILD_TYPE}}

    - name: Save Artifacts
      working-directory: ${{github.workspace}}/build
      run: qa save-artifacts

    - name: Run Test Vectors
      working-directory: ${{github.workspace}}/CIS
      run: qa batch tv-all

    - name: Bit-Accuracy
      working-directory: ${{github.workspace}}/CIS
      run: qa check-bit-accuracy
