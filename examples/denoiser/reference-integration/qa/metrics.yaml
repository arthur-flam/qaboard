# you must define metadata about all your objective figures of merits
available_metrics:
  # loss:
  #   label: My Loss Function  # defaults to the key
  #   short_label: Loss        # defaults to the label
  #   description: The was computed with.... # optional
  #   smaller_is_better: true  # default
  #   target: 0.01             # optionnal
  #   # used for display
  #   scale: 1.0               # default
  #   suffix: %                # default: ''

  psnr:
    label: PSNR
    description: Peak signal-to-noise ratio of the output vs the ground truth (data/clean/).
    smaller_is_better: false
    target: 30
    suffix: " dB"
    plot_scale: linear

  psnr_gain:
    label: PSNR gain
    short_label: Gain
    description: How much better the output's PSNR is than the noisy input's.
    smaller_is_better: false
    target: 6
    suffix: " dB"
    plot_scale: linear

  ssim:
    label: SSIM
    description: Structural similarity of the output's luma vs the ground truth (1 is perfect).
    smaller_is_better: false
    target: 0.9
    plot_scale: linear

  runtime_ms:
    label: Runtime
    description: Time spent denoising (without reading and writing images).
    smaller_is_better: true
    target: 500
    suffix: " ms"

  is_failed:
    label: Crashed
    short_label: Crashed
    description: This run crashed.
    scale: 100
    suffix: "%"
    target: 0
    smaller_is_better: true
    plot_scale: linear # | default: log


# Below we define which metrics the GUI should show
default_metric: psnr

# will be shown in the summary histogramms
summary_metrics:
  - psnr
  - ssim
  - runtime_ms

# will be shown in the results table and in the output cards
main_metrics:
  - psnr
  - ssim
  - psnr_gain
  - runtime_ms

# In the history view, only those metrics will be available in the plot showing results over time
# [OPTIONNAL]: defaults to the summary_metrics
dashboard_evolution_metrics:
  - psnr
  - ssim
  - runtime_ms
# In the history view, only those metrics will be shown in the summary histograms
# [OPTIONNAL]: defaults to the summary_metrics
