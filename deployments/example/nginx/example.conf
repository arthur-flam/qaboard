# Added to nginx's conf.d: example.yml mounts this folder at /tmp/deployment/nginx/conf.d, services/nginx/configure.sh
# copies it. A qaboard.conf here replaces the default one (services/nginx/conf.d/qaboard.conf).
# e.g. a server that answers which site this is, inside the compose network: curl http://proxy:5004/site
server {
  listen 5004;
  location = /site {
    default_type text/plain;
    return 200 "example\n";
  }
}
