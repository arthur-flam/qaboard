# The compose overlay of the example site: copy this folder to your site directory and rename it, e.g.
#   git init ../qaboard-site && cp -r deployments/example ../qaboard-site/mysite
# then rename example to mysite in its files. See website/docs/backend-admin/site-directory.mdx
#
# Usage (deploy.py sets QABOARD_SITE_DIR, the folder with this folder):
#   deployments/deploy.py ../qaboard-site/mysite/production.env up
# Paths in this file: relative ones are from the root of the qaboard repository, so the site's own files are under
# ${QABOARD_SITE_DIR}/example/. CI checks that this example renders (tests/test_site_dir.py) and builds.

x-build-args: &build-args
  # Behind a proxy: also set them for frontend, website and proxy
  # PROXY_URL: http://proxy.example.com:8080
  # NO_PROXY: localhost,git.example.com
  # A CA to trust (e.g. a proxy that replaces certificates), downloaded during the build
  # CA_CERT_URL: http://pki.example.com/ca.crt
  {}

services:
  backend:
    build:
      args:
        <<: *build-args
        # Installs the site package of this folder's cli/ in the image (it's named qaboard-site-<QABOARD_EXTRA>), e.g.
        # for the server's annotations or thumbnails entry points, and the defaults it shares with `qa`
        QABOARD_EXTRA: example
        # More CAs to trust, in this folder, e.g. an intermediate certificate your IdP doesn't send
        # CA_CERTS: "certs/intermediate.crt"
      # This folder, for the build: the site package (cli/), the certificates
      additional_contexts:
        site-config: ${QABOARD_SITE_DIR:-./deployments}/example
    # Your site's secrets: .env next to production.env (deploy.py reads it), e.g. SECRET_KEY, QABOARD_DB_PASSWORD,
    # QABOARD_LDAP_PASSWORD. Start from .env.example
    environment:
      # Authentication: LOCAL (default), LDAP, SAML (website/docs/backend-admin/sign-in.mdx)
      # - QABOARD_LOGIN_TYPE=LDAP
      # - QABOARD_LDAP_HOST=ldap.example.com
      # - QABOARD_LDAP_USER_BASE=dc=example,dc=com
      # With SAML: python3-saml's settings in saml/ in this folder, mounted below
      # - QABOARD_SAML_DIR=/etc/qaboard/saml

      # Where batches started from the web app (tuning, redo) run: not set, the server starts none. kubernetes, lsf,
      # or local/celery: in the backend's container, as its account, so anyone who can start a batch runs code there
      # (see https://samsung.github.io/qaboard/docs/backend-admin/runners)
      # - QABOARD_TUNING_RUNNER=lsf
      # - QA_RUNNERS_LSF_BRIDGE=ssh user@lsf-host 'bsub_su {user} -I {bsub_command}'

      # Image servers (JSON map of file extensions to IIIF endpoints)
      # - QABOARD_IMAGE_SERVERS={"default": "/iiif"}

      # Observability with Sentry (set to enable), see https://samsung.github.io/qaboard/docs/backend-admin/monitoring
      # - SENTRY_DSN=https://...@sentry.example.com/1
      # - SENTRY_ENVIRONMENT=production

      # Output path user (for multi-user environments)
      # - QABOARD_DEFAULT_USER=qaboard

      # Where your projects store results (default: /mnt/qaboard). The server refuses to write, delete
      # or run code anywhere else, e.g. in folders sent by a client. Separated by ":"
      # Datasets it only reads: Admin > Storage > Data folders instead
      # - QABOARD_STORAGE_ROOTS=/mnt/qaboard:/algo/results

      # What scripts install besides qaboard to use `qa` here (the web app's Script snippets): your site package,
      # from your site repository
      - QABOARD_CLI_REQUIREMENTS=qaboard-site-example @ git+https://git.example.com/infra/qaboard-site#subdirectory=example/cli
    volumes:
    # Files of your site for the backend, e.g. a git hosts file (website/docs/backend-admin/git-hosts.mdx)
    - ${QABOARD_SITE_DIR:-./deployments}/example/backend:/etc/qaboard/site:ro
    # - ${QABOARD_SITE_DIR:-./deployments}/example/saml:/etc/qaboard/saml:ro
    # Your results storage, at the same path as the clients (see website/docs/start-server.mdx)
    # - /mnt/qaboard:/mnt/qaboard

  proxy:
    build:
      args:
        <<: *build-args
    volumes:
    # nginx configuration added to the default (a qaboard.conf replaces the default one): the folder, not each file,
    # whose bind mounts keep showing the old version after `git pull` replaces them (services/nginx/configure.sh)
    - ${QABOARD_SITE_DIR:-./deployments}/example/nginx:/tmp/deployment/nginx/conf.d:ro
    # nginx serves /s/<path> from /var/qaboard/<path>
    # - /mnt/qaboard:/var/qaboard/mnt/qaboard:ro

  # The image server reads /iiif/2/<path> from /repository/<path>
  # cantaloupe:
  #   volumes:
  #     - /mnt/qaboard:/repository/mnt/qaboard:ro
  # Or disable it if you use a different image server:
  #   profiles: [disabled]

  frontend:
    build:
      args:
        <<: *build-args

  website:
    build:
      args:
        <<: *build-args
      # The docs for your users, built into the web app's docs with QABOARD_SITE=example (production.env): site-docs/
      additional_contexts:
        site-config: ${QABOARD_SITE_DIR:-./deployments}/example
