# nginx's "combined" format, prefixed with "publish " (see access_log below)
log_format publish 'publish $remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
  # 80: http://publish, when the publish DNS name points to this host (qaboard.conf is the default server)
  listen 80;
  listen 5003;
  server_name publish publish.*;

  listen 443 ssl;
  ssl_certificate_key /ssl/publish.key;
  ssl_certificate /ssl/publish.pem;

  # To the container's logs, which docker rotates (files in the container grew until it was recreated).
  # The format tells them apart from QA-Board's requests: `docker compose logs --no-log-prefix proxy | grep '^publish '`
  access_log /dev/stdout publish;
  error_log stderr;

  location / {
    proxy_pass http://qatools01:5045/;
  }
}
