# nginx's "combined" format, prefixed with "dvd " (see access_log below)
log_format dvd 'dvd $remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
  # 80: http://dvd, when the dvd DNS name points to this host (qaboard.conf is the default server)
  listen 80;
  listen 5003;
  server_name dvd dvd.*;

  # To the container's logs, which docker rotates (files in the container grew until it was recreated).
  # The format tells them apart from QA-Board's requests: `docker compose logs --no-log-prefix proxy | grep '^dvd '`
  access_log /dev/stdout dvd;
  error_log stderr;

  location / {
    proxy_pass http://qatools01:5044/;
  }
}
