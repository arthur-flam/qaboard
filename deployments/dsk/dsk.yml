# DSK (Device Solution Korea) compose overlay
# Usage: docker compose -f docker-compose.yml -f production.yml -f deployments/dsk/dsk.yml up

# Set these in .env or override below with your DSK proxy/cert values:
#   PROXY_URL, CA_CERT_URL, NO_PROXY
x-dsk-build-args: &dsk-build-args
  PROXY_URL: ${PROXY_URL:-}
  CA_CERT_URL: ${CA_CERT_URL:-}
  GIT_SERVER: "github.sec.samsung.net"
  CDE_PACKAGE: "cde @ git+ssh://git@github.sec.samsung.net/CDE/cde-python"
  NO_PROXY: ${NO_PROXY:-}

services:
  backend:
    build:
      args:
        <<: *dsk-build-args
        QABOARD_EXTRA: "dsk"
    env_file:
      - .env
      - deployments/dsk/.env
    environment:
      - QABOARD_LOGIN_TYPE=${QABOARD_LOGIN_TYPE:-SAML}
      - QABOARD_LOGIN_REQUIRED=${QABOARD_LOGIN_REQUIRED:-}
      - QABOARD_TUNING_RUNNER=celery
      - QABOARD_DEFAULT_USER=qaboard
      - QABOARD_HOST=${QABOARD_HOST:-12.36.168.155}
      - QABOARD_PROTOCOL=http
      - CELERY_BROKER_URL=pyamqp://guest:guest@rabbitmq:5672//
      - 'QABOARD_IMAGE_SERVERS={"default": "/iiif", "raw,hex,cde": "/iiif/cde"}'

  frontend:
    build:
      args:
        <<: *dsk-build-args
    # Note: the webapp gets login_type/login_required from the backend (/api/v1/config)

  proxy:
    build:
      args:
        <<: *dsk-build-args
    volumes:
    # The folder, not the file: see deployments/sirc/sirc.yml
    - ./deployments/dsk/nginx:/tmp/deployment/nginx/conf.d:ro
    # nginx/dsk.conf proxies /flower/ to it: nginx doesn't start without it
    depends_on:
    - flower

  # Always started, as before docker-compose.yml put pgadmin and flower behind the "tools" profile. It now publishes
  # their ports and RabbitMQ's on 127.0.0.1 only: for all the host's interfaces as before (e.g. for Celery workers on
  # other hosts), set QABOARD_TOOLS_HOST_IP= and QABOARD_RABBITMQ_HOST_IP= (empty) in .env
  # flower shares the backend image (which installs flower>=2.1.0), so only backend needs building
  flower:
    profiles: !reset []

  pgadmin:
    profiles: !reset []

  # nginx/dsk.conf serves /iiif/2 with it. As before docker-compose.yml stopped mounting the whole host:
  # TODO(dsk): mount only the storage (/algo, /mnt...), read-only
  cantaloupe:
    volumes:
    - /:/repository

  cron-backup-db:
    environment:
      - AS_USER_NAME=qaboard
      - AS_USER_UID=1001
      - AS_USER_GID=1001
    volumes:
      - /var/qaboard/data/backups:/backup


