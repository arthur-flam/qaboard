# QA-Board's settings for postgres, on top of the cluster's own postgresql.conf (initdb's, maybe edited by hand).
# Used by deployments/sirc/sirc.yml: services/db/init.sh copies this file to $PGDATA/postgres.conf at startup and
# makes postgresql.conf include it last, so the settings below win.
#
# Sized for SIRC's production host: 8 cores, 31 GB of RAM *shared* with other stacks and 2 backend replicas.
# Staging uses it too: on a small database, postgres only uses the memory it needs.
#
# Applied when the db container restarts (deploys don't restart it, see deployments/sirc/runbooks/performance.md).
# Check what is applied, and from which file:
#   SELECT name, setting, unit, sourcefile FROM pg_settings WHERE source = 'configuration file';
# Docs: https://www.postgresql.org/docs/12/runtime-config.html https://pgtune.leopard.in.ua/

# - Connections -
listen_addresses = '*'
# Backends: replicas x uwsgi processes x ~4 threads, x1.5 during rolling deploys, plus backups, metabase, pgadmin
max_connections = 200
# Sessions left "idle in transaction" hold memory and locks, and block vacuum. Requests time out after 5min anyway.
idle_in_transaction_session_timeout = 10min
# Notice dead clients (e.g. a killed container) after ~5min instead of ~2h
tcp_keepalives_idle = 300
tcp_keepalives_interval = 30
tcp_keepalives_count = 5

# - Memory -
shared_buffers = 4GB
huge_pages = off
# per sort/hash operation, per connection: keep it modest with 200 connections
work_mem = 16MB
maintenance_work_mem = 512MB
autovacuum_work_mem = 256MB
# planner hint, nothing is allocated: what postgres can expect from the OS page cache on the shared host
effective_cache_size = 12GB

# - Disk -
effective_io_concurrency = 200
# 4 (the default) assumes spinning disks, 1.1 local SSDs. Most reads are cached. Revisit with pg_stat_statements.
random_page_cost = 2.0

# - WAL / checkpoints -
# Fewer, spread checkpoints: less I/O on a host where I/O is the bottleneck. Crash recovery takes a bit longer.
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# - Logging -
# stderr only: docker collects it (and sends it to fluentd/ELK in production, see deployments/sirc/prod.yml)
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d %a '
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 60s
log_connections = off
log_disconnections = off
log_statement = 'none'

# - Statistics -
# Which queries cost the most: CREATE EXTENSION IF NOT EXISTS pg_stat_statements; then query pg_stat_statements
shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on
