<title>QA-Board Tweak Sessions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: QA-Board's shell (dark sider, light surfaces, Blueprint-like controls), dense three-pane tool views. */
:root {
  --qa-background: #f0f2f5;
  --qa-surface: #ffffff;
  --qa-surface-alt: #f6f7f9;
  --qa-text: rgba(0,0,0,0.85);
  --qa-text-secondary: rgba(0,0,0,0.65);
  --qa-text-muted: #5f6b7c;
  --qa-link: #1b69b6;
  --qa-border: rgba(17,20,24,0.15);
  --qa-hover: rgba(45,114,210,0.08);
  --qa-sider: #1c2127;
  --qa-sider-text: #c5cbd3;
  --qa-primary: #2d72d2;
  --qa-primary-fg: #ffffff;
  --qa-danger: #ac2f33;
  --qa-success: #1c6e42;
  --qa-warning: #935610;
  --qa-highlight: rgba(251,179,96,0.22);
  --qa-patch: rgba(45,114,210,0.10);
  --qa-cached: #8f99a8;
  --qa-recompute: #2d72d2;
  --qa-overhead: #d1980b;
  --qa-tag: rgba(143,153,168,0.15);
  --qa-viewer-bg: #111418;
  --font: -apple-system, "BlinkMacSystemFont", "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Open Sans", "Helvetica Neue", "Icons16", sans-serif;
  --mono: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --qa-background: #1c2127; --qa-surface: #252a31; --qa-surface-alt: #2f343c; --qa-text: #f6f7f9;
  --qa-text-secondary: rgba(255,255,255,0.72); --qa-text-muted: #abb3bf; --qa-link: #8abbff;
  --qa-border: rgba(255,255,255,0.15); --qa-hover: rgba(138,187,255,0.1); --qa-sider: #111418; --qa-sider-text: #abb3bf;
  --qa-primary: #4c90f0; --qa-primary-fg: #ffffff; --qa-danger: #fa999c; --qa-success: #72ca9b; --qa-warning: #fbb360;
  --qa-highlight: rgba(251,179,96,0.16); --qa-patch: rgba(76,144,240,0.16); --qa-cached: #5f6b7c; --qa-recompute: #4c90f0;
  --qa-overhead: #d1980b; --qa-tag: rgba(143,153,168,0.2); --qa-viewer-bg: #0b0d10; color-scheme: dark; } }
:root[data-theme="dark"] {
  --qa-background: #1c2127; --qa-surface: #252a31; --qa-surface-alt: #2f343c; --qa-text: #f6f7f9;
  --qa-text-secondary: rgba(255,255,255,0.72); --qa-text-muted: #abb3bf; --qa-link: #8abbff;
  --qa-border: rgba(255,255,255,0.15); --qa-hover: rgba(138,187,255,0.1); --qa-sider: #111418; --qa-sider-text: #abb3bf;
  --qa-primary: #4c90f0; --qa-primary-fg: #ffffff; --qa-danger: #fa999c; --qa-success: #72ca9b; --qa-warning: #fbb360;
  --qa-highlight: rgba(251,179,96,0.16); --qa-patch: rgba(76,144,240,0.16); --qa-cached: #5f6b7c; --qa-recompute: #4c90f0;
  --qa-overhead: #d1980b; --qa-tag: rgba(143,153,168,0.2); --qa-viewer-bg: #0b0d10; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--qa-background); color: var(--qa-text); font: 13px/1.4 var(--font); }
button, input, select { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); font-size: 12px; }
a { color: var(--qa-link); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--qa-primary); outline-offset: 1px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--qa-text-muted); }
.small { font-size: 12px; }

/* shell */
.app { display: grid; grid-template-columns: 184px minmax(0,1fr); height: 100%; }
.sider { background: var(--qa-sider); color: var(--qa-sider-text); padding: 10px 0; display: flex; flex-direction: column; gap: 2px; }
.sider .logo { color: #fff; font-weight: 600; padding: 4px 16px 14px; letter-spacing: .02em; }
.sider .logo small { display: block; font-weight: 400; color: var(--qa-sider-text); font-size: 11px; }
.sider a { color: var(--qa-sider-text); padding: 6px 16px; display: flex; gap: 8px; align-items: center; }
.sider a:hover { background: rgba(255,255,255,.06); text-decoration: none; }
.sider a.on { color: #fff; background: rgba(255,255,255,.1); box-shadow: inset 3px 0 0 #4c90f0; }
.sider .sep { height: 1px; background: rgba(255,255,255,.08); margin: 8px 0; }
.sider .hint { padding: 6px 16px; font-size: 11px; line-height: 1.45; color: #8f99a8; }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.navbar { background: var(--qa-surface); border-bottom: 1px solid var(--qa-border); display: flex; align-items: center; gap: 10px; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px 16px; flex-wrap: wrap; min-height: 44px; }
.crumbs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; min-width: 0; }
.crumbs .sep { color: var(--qa-text-muted); }
.navbar .grow { flex: 1; }
.content { flex: 1; min-height: 0; overflow: auto; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px 16px; }

/* blueprint-ish */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--qa-border); background: var(--qa-surface); border-radius: 3px; padding: 3px 9px; min-height: 26px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--qa-hover); }
.btn.primary { background: var(--qa-primary); color: var(--qa-primary-fg); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.minimal { border-color: transparent; background: transparent; }
.btn.minimal:hover { background: var(--qa-hover); }
.btn.small { min-height: 22px; padding: 1px 7px; font-size: 12px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.on { background: var(--qa-patch); border-color: var(--qa-primary); }
.btn-group { display: inline-flex; }
.btn-group .btn { border-radius: 0; margin-left: -1px; }
.btn-group .btn:first-child { border-radius: 3px 0 0 3px; margin-left: 0; }
.btn-group .btn:last-child { border-radius: 0 3px 3px 0; }
.tag { display: inline-flex; align-items: center; gap: 4px; background: var(--qa-tag); border-radius: 3px; padding: 0 6px; font-size: 12px; line-height: 18px; white-space: nowrap; }
.tag.primary { background: var(--qa-patch); color: var(--qa-link); }
.tag.success { background: color-mix(in srgb, var(--qa-success) 16%, transparent); color: var(--qa-success); }
.tag.danger { background: color-mix(in srgb, var(--qa-danger) 14%, transparent); color: var(--qa-danger); }
.tag.warning { background: color-mix(in srgb, var(--qa-warning) 16%, transparent); color: var(--qa-warning); }
.tag.minimal { background: transparent; border: 1px solid var(--qa-border); }
.card { background: var(--qa-surface); border: 1px solid var(--qa-border); border-radius: 3px; }
.panel-h { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--qa-border); font-weight: 600; min-height: 34px; flex-wrap: wrap; }
.panel-h .grow { flex: 1; }
.label { text-transform: uppercase; letter-spacing: .06em; font-size: 11px; color: var(--qa-text-muted); font-weight: 600; }
input[type=text], input[type=number], input[type=search], select { background: var(--qa-surface); border: 1px solid var(--qa-border); border-radius: 3px; padding: 2px 6px; min-height: 24px; }
input[type=number] { width: 84px; font-family: var(--mono); font-size: 12px; }
input[type=range] { accent-color: var(--qa-primary); width: 130px; }
input[type=checkbox] { accent-color: var(--qa-primary); }
.callout { border-radius: 3px; padding: 8px 10px; background: var(--qa-tag); display: flex; gap: 8px; align-items: flex-start; }
.callout.primary { background: var(--qa-patch); }
.callout.warning { background: color-mix(in srgb, var(--qa-warning) 12%, transparent); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.ico { width: 14px; height: 14px; flex: none; }

/* run page */
.commit-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.commit-head h2 { margin: 0; font-size: 16px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--qa-border); margin-bottom: 10px; flex-wrap: wrap; }
.tabs a { padding: 6px 10px; color: var(--qa-text-secondary); border-bottom: 2px solid transparent; }
.tabs a.on { color: var(--qa-text); border-color: var(--qa-primary); font-weight: 600; }
.tabs a:hover { text-decoration: none; color: var(--qa-text); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; }
.out-card .head { padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--qa-border); }
.out-card .title { display: flex; gap: 6px; align-items: center; font-weight: 600; min-width: 0; }
.out-card .title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.out-card .row { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.out-card .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 8px; padding: 6px 10px; border-bottom: 1px solid var(--qa-border); }
.metric .k { font-size: 11px; color: var(--qa-text-muted); }
.metric .v { font-family: var(--mono); font-size: 12px; }
.out-card canvas, .viewer canvas { display: block; width: 100%; height: auto; background: var(--qa-viewer-bg); image-rendering: auto; }
.new-btn { position: relative; }
.new-btn::after { content: "new"; position: absolute; top: -7px; right: -6px; background: var(--qa-overhead); color: #1c2127; font-size: 9px; font-weight: 700; padding: 0 3px; border-radius: 2px; text-transform: uppercase; }
.sessions-strip { display: flex; flex-direction: column; gap: 2px; padding: 6px 10px; border-top: 1px solid var(--qa-border); }

/* tweak view */
.tweak { display: grid; grid-template-columns: 250px minmax(0, 1fr) minmax(300px, 0.9fr); gap: 10px; align-items: start; }
.tweak > .card { min-width: 0; }
.chain-list { list-style: none; margin: 0; padding: 4px 0; }
.chain-list li { display: grid; grid-template-columns: 18px minmax(0,1fr) auto; gap: 2px 8px; align-items: center; padding: 5px 10px; cursor: pointer; position: relative; }
.chain-list li:hover { background: var(--qa-hover); }
.chain-list li.on { background: var(--qa-patch); box-shadow: inset 3px 0 0 var(--qa-primary); }
.chain-list .idx { font-family: var(--mono); font-size: 11px; color: var(--qa-text-muted); text-align: right; }
.chain-list .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chain-list .id { font-family: var(--mono); font-size: 11px; color: var(--qa-text-muted); grid-column: 2; }
.chain-list .rt { grid-row: 1 / span 2; grid-column: 3; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.chain-list li:not(:last-child)::after { content: ""; position: absolute; left: 22px; bottom: -4px; height: 8px; border-left: 1px dashed var(--qa-border); }
.search-wrap { position: relative; padding: 8px 10px; border-bottom: 1px solid var(--qa-border); }
.search-wrap input { width: 100%; }
.suggest { position: absolute; left: 10px; right: -160px; top: 36px; z-index: 20; background: var(--qa-surface); border: 1px solid var(--qa-border); border-radius: 3px; box-shadow: 0 6px 20px rgba(0,0,0,.18); max-height: 340px; overflow: auto; }
.suggest div { padding: 5px 8px; cursor: pointer; display: grid; grid-template-columns: auto 1fr; gap: 0 8px; }
.suggest div:hover, .suggest div.on { background: var(--qa-hover); }
.suggest .d { grid-column: 1 / -1; font-size: 11px; color: var(--qa-text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
mark { background: var(--qa-highlight); color: inherit; }
.regs { width: 100%; border-collapse: collapse; }
.regs td { border-top: 1px solid var(--qa-border); padding: 6px 10px; vertical-align: top; }
.regs tr.mod td { background: var(--qa-patch); }
.regs tr.flash td { animation: flash 1.2s; }
@keyframes flash { from { background: var(--qa-highlight); } }
.regs .k { width: 40%; min-width: 150px; }
.regs .k .n { font-family: var(--mono); font-size: 12px; font-weight: 600; }
.regs .k .doc { color: var(--qa-text-muted); font-size: 12px; margin-top: 2px; }
.regs .k .meta { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
.ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.arr { display: grid; gap: 3px; }
.arr input[type=number] { width: 58px; padding: 1px 3px; }
.src { font-size: 11px; }
.switch { position: relative; width: 30px; height: 16px; display: inline-block; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span { position: absolute; inset: 0; background: var(--qa-cached); border-radius: 8px; cursor: pointer; transition: background .15s; }
.switch span::before { content: ""; position: absolute; width: 12px; height: 12px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: transform .15s; }
.switch input:checked + span { background: var(--qa-primary); }
.switch input:checked + span::before { transform: translateX(14px); }
.switch input:focus-visible + span { outline: 2px solid var(--qa-primary); outline-offset: 1px; }
.viewer { display: flex; flex-direction: column; gap: 4px; }
.viewer .cap { display: flex; gap: 6px; align-items: center; font-size: 12px; flex-wrap: wrap; }
.viewer-wrap { position: relative; }
.viewer-wrap .split-line { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; pointer-events: none; mix-blend-mode: difference; }
.viewer-wrap .lbl { position: absolute; top: 4px; font-size: 11px; color: #fff; background: rgba(0,0,0,.55); padding: 0 5px; border-radius: 2px; }
.viewers { display: flex; flex-direction: column; gap: 10px; padding: 10px; }

/* pending bar */
.pending { position: sticky; bottom: 0; z-index: 10; margin-top: 10px; background: var(--qa-surface); border: 1px solid var(--qa-border); border-top: 2px solid var(--qa-primary); border-radius: 3px; box-shadow: 0 -4px 14px rgba(0,0,0,.08); }
.pending .bar { display: flex; gap: 10px; align-items: center; padding: 8px 10px; flex-wrap: wrap; }
.pending .chips { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; min-width: 200px; }
.chip { display: inline-flex; gap: 4px; align-items: center; font-family: var(--mono); font-size: 12px; background: var(--qa-patch); border-radius: 3px; padding: 1px 4px 1px 6px; }
.chip .old { color: var(--qa-text-muted); text-decoration: line-through; }
.chip button { border: 0; background: transparent; cursor: pointer; padding: 0 2px; color: var(--qa-text-muted); }
.estimate { display: flex; flex-direction: column; gap: 3px; min-width: 220px; }
.stack { display: flex; height: 6px; border-radius: 2px; overflow: hidden; background: var(--qa-tag); width: 220px; max-width: 100%; }
.stack i { display: block; height: 100%; }
.patch-detail { border-top: 1px solid var(--qa-border); padding: 8px 10px; display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; }
pre { margin: 0; background: var(--qa-surface-alt); border: 1px solid var(--qa-border); border-radius: 3px; padding: 8px; overflow: auto; font-family: var(--mono); font-size: 12px; line-height: 1.45; }

/* session view */
.session { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 10px; align-items: start; }
.tree { list-style: none; margin: 0; padding: 4px 0; }
.tree li { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 0 6px; padding: 5px 10px 5px 6px; cursor: pointer; align-items: start; }
.tree li:hover { background: var(--qa-hover); }
.tree li.on { background: var(--qa-patch); box-shadow: inset 3px 0 0 var(--qa-primary); }
.tree .gutter { font-family: var(--mono); color: var(--qa-text-muted); white-space: pre; font-size: 12px; line-height: 18px; }
.tree .nm { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; line-height: 18px; }
.tree .sub { display: block; font-family: var(--mono); font-size: 11px; color: var(--qa-text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree .rt { text-align: right; font-size: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.kv { display: grid; grid-template-columns: max-content minmax(0,1fr); gap: 4px 12px; }
table.t { width: 100%; border-collapse: collapse; }
table.t th { text-align: left; font-weight: 600; font-size: 12px; color: var(--qa-text-muted); padding: 5px 10px; border-bottom: 1px solid var(--qa-border); white-space: nowrap; }
table.t td { padding: 5px 10px; border-bottom: 1px solid var(--qa-border); vertical-align: middle; }
table.t td.mono, table.t td .mono { font-family: var(--mono); font-size: 12px; }
table.t tr.grp td { background: var(--qa-surface-alt); font-weight: 600; font-size: 12px; }
.better { color: var(--qa-success); }
.worse { color: var(--qa-danger); }
.timing { position: relative; height: 14px; background: var(--qa-tag); border-radius: 2px; min-width: 120px; }
.timing i { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; align-items: center; }
.legend span { display: inline-flex; gap: 5px; align-items: center; }
.scroll-x { overflow-x: auto; }
.dialog-bg { position: fixed; inset: 0; background: rgba(17,20,24,.5); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
.dialog { background: var(--qa-surface); border-radius: 4px; width: min(760px, 100%); max-height: 90vh; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
.dialog .body { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.dialog .foot { padding: 8px 12px; border-top: 1px solid var(--qa-border); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.diff-add { color: var(--qa-success); }
.diff-del { color: var(--qa-danger); }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); z-index: 60; background: var(--qa-sider); color: #f6f7f9; padding: 8px 12px; border-radius: 3px; box-shadow: 0 6px 20px rgba(0,0,0,.3); max-width: 380px; }
.live { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--qa-border); border-radius: 12px; padding: 1px 9px 1px 7px; font-size: 12px; cursor: pointer; background: var(--qa-surface); }
.pop { position: absolute; right: 16px; top: 46px; z-index: 30; width: min(360px, calc(100vw - 32px)); }
.spin { width: 10px; height: 10px; border: 2px solid var(--qa-tag); border-top-color: var(--qa-primary); border-radius: 50%; animation: sp 0.8s linear infinite; display: inline-block; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin, .regs tr.flash td { animation: none; } }
.note-flag { font-size: 11px; color: var(--qa-warning); }

@media (max-width: 1250px) { .tweak { grid-template-columns: 230px minmax(0,1fr); } .tweak .viewers-card { grid-column: 1 / -1; } .tweak .viewers { flex-direction: row; flex-wrap: wrap; } .tweak .viewers .viewer { flex: 1 1 300px; } }
@media (max-width: 900px) { .session { grid-template-columns: minmax(0,1fr); } .patch-detail { grid-template-columns: minmax(0,1fr); } }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0,1fr); } .sider { display: none; }
  .tweak { grid-template-columns: minmax(0,1fr); }
  .navbar, .content { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .regs .k { min-width: 0; width: auto; } .regs tr { display: grid; } .regs td { border-top: 0; } .regs tr td:first-child { border-top: 1px solid var(--qa-border); }
  .suggest { right: 10px; }
  .out-card .metrics { grid-template-columns: repeat(2, 1fr); }
}
</style>

<div class="app">
  <nav class="sider" aria-label="Project">
    <div class="logo">QA-Board<small>isp/sim-pipeline</small></div>

    <a>⌁ History</a>

  <div class="main">
    <header class="navbar" id="navbar"></header>
    <main class="content" id="content"></main>

<script>
"use strict";
// ---------------------------------------------------------------------------------------------------------------------
// Fake data. Everything image-specific is here (the schema, the viewer's fake renderer); the UI code reads only the
// schema contract: groups (blocks) in order, parameters with a type, range, default, doc and optional widget hint,
// and the streams each group produces.
// ---------------------------------------------------------------------------------------------------------------------
const SCHEMA = {
  group_label: "Block",           // what the project calls its stages
  binary: "isp_sim v4.18.0 (from the commit's artifacts)",
  groups: [
    { id: "blc", name: "Black level", streams: ["out"], params: [
      { k: "enable", t: "bool", d: true, doc: "Subtract the sensor's black level." },
      { k: "offset_r", t: "int", min: 0, max: 1023, d: 64, unit: "DN", doc: "Black level of the R channel, in 10-bit DN." },
      { k: "offset_gr", t: "int", min: 0, max: 1023, d: 64, unit: "DN", doc: "Black level of Gr." },
      { k: "offset_gb", t: "int", min: 0, max: 1023, d: 64, unit: "DN", doc: "Black level of Gb." },
      { k: "offset_b", t: "int", min: 0, max: 1023, d: 64, unit: "DN", doc: "Black level of B." },

    const x = i % W, y = (i / W) | 0;
    let R, G, B;
    if (gray) { R = G = B = clamp01(gray[i]); if (stream === "stats") { R = clamp01(gray[i] * 1.1); G = clamp01(gray[i]); B = clamp01(gray[i] * 0.9); } }
    else if (img.mosaic) { const c = (y & 1) ? ((x & 1) ? b[i] : g[i]) : ((x & 1) ? g[i] : r[i]); R = G = B = Math.pow(clamp01(c), 1 / 2.2); }
    else { R = clamp01(r[i]); G = clamp01(g[i]); B = clamp01(b[i]); }
    d.data[4 * i] = R * 255; d.data[4 * i + 1] = G * 255; d.data[4 * i + 2] = B * 255; d.data[4 * i + 3] = 255;
  }
  return d;
}
// <canvas data-img='{"a":{"run":"r3","stage":7},"b":{...},"stream":"out","gid":"nr","split":50}'>
function drawCanvases(root) {
  root.querySelectorAll("canvas[data-img]").forEach(cv => {
    const spec = JSON.parse(cv.dataset.img);
    cv.width = W; cv.height = H;
    const ctx = cv.getContext("2d");
    const imgA = renderStage(valuesOf(spec.a.run, spec.a.extra), spec.a.stage);
    ctx.putImageData(toImageData(imgA, spec.stream, spec.gid, ctx), 0, 0);
    if (spec.b) {
      const imgB = renderStage(valuesOf(spec.b.run, spec.b.extra), spec.b.stage);
      const cut = Math.round(W * spec.split / 100);
      ctx.putImageData(toImageData(imgB, spec.stream, spec.gid, ctx), 0, 0, cut, 0, W - cut, H);
    }
  });
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtV = v => Array.isArray(v) ? `[${v.join(", ")}]` : typeof v === "number" ? (Number.isInteger(v) ? String(v) : String(+v.toFixed(3))) : String(v);
const short = v => { const s = fmtV(v); return s.length > 18 ? s.slice(0, 16) + "…]" : s; };
const secs = s => s < 1 ? `${(s * 1000).toFixed(0)} ms` : s < 90 ? `${s.toFixed(1)} s` : `${Math.floor(s / 60)} min ${Math.round(s % 60)} s`;
const groupOf = id => GROUPS.find(g => g.id === id);
const stageOut = gid => GROUPS.findIndex(g => g.id === gid) + 1;
const runLabel = id => `#${RUNS[id].n}`;
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
function delta(m, a, b) {
  if (a == null || b == null) return "";
  const d = a - b; if (Math.abs(d) < 1e-9) return `<span class="muted">±0</span>`;
  const good = m.better === "lower" ? d < 0 : d > 0;
  const rel = b ? ` (${d > 0 ? "+" : ""}${(100 * d / Math.abs(b)).toFixed(1)}%)` : "";
  return `<span class="${good ? "better" : "worse"}">${d > 0 ? "+" : ""}${m.fmt(d)}${rel}</span>`;
}
function statusTag(r) {
  if (r.status === "running") return `<span class="tag primary"><span class="spin"></span> running ${Math.round((r.progress || 0) * 100)}%</span>`;
  if (r.status === "queued") return `<span class="tag warning">queued</span>`;
  if (r.status === "failed") return `<span class="tag danger">failed</span>`;
  return `<span class="tag success">done</span>`;
}

function searchResults() {
  const q = S.q.trim().toLowerCase(); if (!q) return [];
  const terms = q.split(/\s+/);
  return PARAMS.map(p => {
    const hay = `${p.key} ${groupOf(p.group).name} ${p.doc}`.toLowerCase();
    if (!terms.every(t => hay.includes(t))) return null;
    const score = (p.key.includes(q) ? 0 : 1) + (p.k.startsWith(terms[0]) ? 0 : 0.5);
    return { p, score };
  }).filter(Boolean).sort((a, b) => a.score - b.score).slice(0, 12).map(x => x.p);
}
const hl = (text, q) => { let s = esc(text); for (const t of q.trim().split(/\s+/).filter(Boolean)) s = s.replace(new RegExp(`(${t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "ig"), "<mark>$1</mark>"); return s; };

function control(p, cur) {
  const id = `ctl-${p.key.replace(".", "-")}`;
  if (p.t === "bool") return `<label class="switch"><input type="checkbox" id="${id}" data-reg="${p.key}" ${cur ? "checked" : ""}><span></span></label><span class="small muted">${cur ? "on" : "off"}</span>`;
  if (p.t === "enum") return `<select id="${id}" data-reg="${p.key}">${p.options.map(o => `<option ${o === cur ? "selected" : ""}>${o}</option>`).join("")}</select>`;
  if (p.t === "int" || p.t === "float") {
    const step = p.step || 1;
    return `<input type="range" id="${id}-r" data-reg="${p.key}" data-pair="${id}" min="${p.min}" max="${p.max}" step="${step}" value="${cur}" aria-label="${p.key}">
      <input type="number" id="${id}" data-reg="${p.key}" data-pair="${id}-r" min="${p.min}" max="${p.max}" step="${step}" value="${cur}" aria-label="${p.key} value">${p.unit ? `<span class="small muted">${p.unit}</span>` : ""}`;
  }
  if (p.t.endsWith("[]")) {
    const cols = p.shape.length === 2 ? p.shape[1] : p.shape[0];
    const grid = `<div class="arr" style="grid-template-columns:repeat(${Math.min(cols, 9)}, auto)">${cur.map((v, i) => `<input type="number" id="${id}-${i}" data-reg="${p.key}" data-i="${i}" step="${p.t === "float[]" ? 0.01 : 1}" value="${v}" aria-label="${p.key}[${i}]">`).join("")}</div>`;
    if (p.widget === "curve") {
      const pts = cur.map((v, i) => `${(i / 8) * 120},${60 - (v / 255) * 60}`).join(" ");
      const def = p.d.map((v, i) => `${(i / 8) * 120},${60 - (v / 255) * 60}`).join(" ");
      return `<div style="display:flex;flex-direction:column;gap:4px"><svg width="124" height="64" viewBox="-2 -2 124 64" role="img" aria-label="Tone curve">
        <rect x="0" y="0" width="120" height="60" fill="var(--qa-surface-alt)" stroke="var(--qa-border)"></rect>
        <polyline points="${def}" fill="none" stroke="var(--qa-cached)" stroke-dasharray="3 2"></polyline>
        <polyline points="${pts}" fill="none" stroke="var(--qa-primary)" stroke-width="1.6"></polyline></svg>${grid}</div>`;
    }
    return grid;
  }
  return "";
}

  const base = RUNS[S.base];
  return `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
      <span class="label">Tweaking</span><span class="mono">${INPUT}</span><span class="tag">linux</span><span class="tag">base</span><span class="tag">outdoor</span>
      <span class="muted">from</span><select id="basepick" aria-label="Run to tweak from">${Object.values(RUNS).filter(r => r.status === "done").map(r => `<option value="${r.id}" ${r.id === S.base ? "selected" : ""}>${runLabel(r.id)} ${r.note ? `· ${esc(r.note)}` : ""}${r.pinned ? " · pinned" : ""}</option>`).join("")}</select>
      ${base.parent ? `<span class="small muted">child of ${runLabel(base.parent)}</span>` : ""}
      <span style="flex:1"></span><a data-go="session" class="small">Session history →</a></div>
    <div class="tweak">${chainPanel()}${registerPanel()}${viewersPanel()}</div>
    ${pendingBar()}`;
}

// ---------------------------------------------------------------------------------------------------------------------
// Session view
// ---------------------------------------------------------------------------------------------------------------------
function treeOrder() {
  const out = [];
  const walk = (id, prefix, last, depth) => {
    out.push({ id, gutter: depth === 0 ? "" : prefix + (last ? "└─" : "├─") });
    const kids = Object.values(RUNS).filter(r => r.parent === id);
    kids.forEach((k, i) => walk(k.id, depth === 0 ? "" : prefix + (last ? "  " : "│ "), i === kids.length - 1, depth + 1));
  };
  walk("r0", "", true, 0);
  return out;
}
function treePanel() {
  const key = METRICS[0], key2 = METRICS[1];
  return `<div class="card">
    <div class="panel-h">Runs<span class="grow"></span><span class="small muted" style="font-weight:400">${Object.keys(RUNS).length} · started ${SESSION.started}</span></div>
    <ul class="tree">${treeOrder().map(({ id, gutter }) => {
      const r = RUNS[id], own = Object.keys(r.own), m = metricsOfRun(id), pm = r.parent ? metricsOfRun(r.parent) : null;
      return `<li class="${S.sel === id ? "on" : ""}" data-act="sel" data-run="${id}" tabindex="0">
        <span class="gutter">${gutter}</span>
        <span style="min-width:0"><span class="nm"><b>${runLabel(id)}</b>${r.pinned ? `<span class="tag warning" title="Pinned">📌 pinned</span>` : ""}${r.parent ? "" : `<span class="tag minimal">root</span>`}${r.note ? `<span class="small">${esc(r.note)}</span>` : ""}</span>
          <span class="sub" title="${esc(own.map(k => `${k}=${fmtV(r.own[k])}`).join(", "))}">${own.length ? own.map(k => `${k}=${short(r.own[k])}`).join(", ") : "run's configurations, no patch"}</span></span>
        <span class="rt">${statusTag(r)}${r.status === "done" ? (pm ? [key, key2].map(mm => `<span class="num small" title="${mm.label} vs parent"><span class="muted">${mm.label}</span> ${delta(mm, m[mm.k], pm[mm.k])}</span>`).join("") : [key, key2].map(mm => `<span class="small muted num">${mm.label} ${mm.fmt(m[mm.k])}</span>`).join("")) : `<span class="small muted">${r.at}</span>`}</span>
      </li>`;
    }).join("")}</ul>
    <div class="small muted" style="padding:6px 10px;border-top:1px solid var(--qa-border)">Deltas against each run's parent. Runs are ordinary runs of batch <span class="mono">${SESSION.batch}</span> on commit ${COMMIT.id}: they show up in the commit's batches, Tuning and the API.</div>
  </div>`;
}

function diffRows(fromVals, toVals, fromLabel, onlyOwn) {
  const rows = [];
  GROUPS.forEach(g => {
    const ks = g.params.map(p => `${g.id}.${p.k}`).filter(k => !eq(fromVals[k], toVals[k]) && (!onlyOwn || k in onlyOwn));
    if (!ks.length) return;
    rows.push(`<tr class="grp"><td colspan="3">${esc(g.name)} <span class="mono muted">${g.id}</span></td></tr>`);
    ks.forEach(k => rows.push(`<tr><td class="mono">${k}</td><td class="mono diff-del">${esc(fmtV(fromVals[k]))}</td><td class="mono diff-add">${esc(fmtV(toVals[k]))}</td></tr>`));
  });
  return rows.length ? `<table class="t"><thead><tr><th>Parameter</th><th>${fromLabel}</th><th>${runLabel(S.sel)}</th></tr></thead><tbody>${rows.join("")}</tbody></table>`
    : `<div class="muted" style="padding:12px">Same parameters.</div>`;
}

function againstOf(id) {
  const r = RUNS[id];
  if (S.diffAgainst === "milestone") { const m = MILESTONES.find(m => m.id === S.milestone); return { label: `⚑ ${m.label}`, vals: { ...valuesOf(null), ...m.params }, metrics: m.metrics, milestone: m }; }
  if (S.diffAgainst === "root" || !r.parent) return { label: "#0 (root)", vals: valuesOf("r0"), metrics: metricsOfRun("r0") };
  return { label: `parent ${runLabel(r.parent)}`, vals: valuesOf(r.parent), metrics: metricsOfRun(r.parent), own: r.own };
}

function detailPanel() {
  const r = RUNS[S.sel], ag = againstOf(S.sel), m = r.status === "done" ? metricsOfRun(S.sel) : null;
  const t = timingsOf(S.sel), tot = total(t);
  const tabs = [["params", "Parameter diff"], ["blocks", "Blocks & timings"], ["metrics", "Metrics"], ["streams", "Compare streams"]];
  let body = "";
  if (S.tab === "params") {
    body = `<div style="padding:8px 10px;display:flex;flex-direction:column;gap:6px">
      ${ag.milestone ? `<div class="callout warning small"><span>⚠</span><span>${esc(ag.milestone.label)} is on commit <span class="mono">${ag.milestone.commit}</span>. This diff compares effective parameter values only. Code and configuration-file changes between the commits are in the commit page's <a>Parameters</a> tab and the git diff.</span></div>` : ""}
      ${ag.own ? `<div class="small muted">The run's own patch against its parent: what the person changed in this step. Switch to <a data-act="against" data-v="root">root</a> for the session's whole patch.</div>` : ""}</div>
      ${diffRows(ag.vals, valuesOf(S.sel), ag.label, null)}`;
  } else if (S.tab === "blocks") {
    const scale = Math.max(tot, 20);
    let acc = t.start;
    body = `<div style="padding:8px 10px" class="legend"><span><span class="dot" style="background:var(--qa-overhead)"></span>start (runner + load)</span><span><span class="dot" style="background:var(--qa-cached)"></span>reused from parent</span><span><span class="dot" style="background:var(--qa-recompute)"></span>recomputed</span><span style="flex:1"></span><b class="num">${r.status === "running" ? `elapsed ${secs(tot * (r.progress || 0))} of ≈ ${secs(tot)}` : `total ${secs(tot)}`}</b></div>
    <div class="scroll-x"><table class="t"><thead><tr><th>${SCHEMA.group_label}</th><th>State</th><th class="num" style="text-align:right">Time</th><th style="width:45%">Timeline</th></tr></thead><tbody>
      <tr><td class="muted">start</td><td><span class="tag warning">overhead</span></td><td class="num" style="text-align:right">${secs(t.start)}</td><td><div class="timing"><i style="left:0;width:${100 * t.start / scale}%;background:var(--qa-overhead)"></i></div></td></tr>
      ${t.blocks.map((b, i) => {
        const left = acc; acc += b.secs;
        const doneAt = (r.progress || 0) * tot;
        const st = r.status === "running" ? (doneAt >= acc ? (b.state === "cached" ? `<span class="tag minimal">reused ${runLabel(b.from)}</span>` : `<span class="tag primary">recomputed</span>`) : doneAt >= left ? `<span class="tag primary"><span class="spin"></span> running</span>` : `<span class="tag minimal muted">waiting</span>`)
          : b.state === "cached" ? `<span class="tag minimal">reused ${runLabel(b.from)}</span>` : `<span class="tag primary">recomputed</span>`;
        return `<tr><td><b>${esc(b.g.name)}</b> <span class="mono muted">${b.g.id}</span></td><td>${st}</td><td class="num" style="text-align:right">${secs(b.secs)}</td>
          <td><div class="timing"><i style="left:${100 * left / scale}%;width:${Math.max(0.6, 100 * b.secs / scale)}%;background:var(${b.state === "cached" ? "--qa-cached" : "--qa-recompute"})"></i></div></td></tr>`;
      }).join("")}
    </tbody></table></div>
    <div class="small muted" style="padding:8px 10px">${r.parent ? `First changed block: <b>${esc(GROUPS[firstChanged(r.own)]?.name || "none")}</b>. Blocks before it were read from ${runLabel(r.parent)}'s intermediate outputs.` : "The root run computed every block."} The run reports these per-block states and times itself (a small <span class="mono">blocks.json</span>): QA-Board shows them, the binary decides what it can reuse.</div>`;
  } else if (S.tab === "metrics") {
    const ms = MILESTONES.find(x => x.id === S.milestone);
    const p = r.parent ? metricsOfRun(r.parent) : null;
    body = `<div class="scroll-x"><table class="t"><thead><tr><th>Metric</th><th class="num">${runLabel(S.sel)}</th><th>vs parent${r.parent ? ` ${runLabel(r.parent)}` : ""}</th><th>vs #0</th><th>vs ⚑ ${esc(ms.label)}</th></tr></thead><tbody>
      ${METRICS.map(mm => `<tr><td>${mm.label}${mm.unit ? ` <span class="muted small">${mm.unit}</span>` : ""} <span class="muted small">${mm.better} is better</span></td>
        <td class="mono num">${m ? mm.fmt(m[mm.k]) : "…"}</td><td class="num">${m && p ? delta(mm, m[mm.k], p[mm.k]) : "–"}</td><td class="num">${m ? delta(mm, m[mm.k], metricsOfRun("r0")[mm.k]) : "–"}</td><td class="num">${m ? delta(mm, m[mm.k], ms.metrics[mm.k]) : "–"}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="small muted" style="padding:8px 10px">Same input in the milestone: ${INPUT}. One run against one run: matching by input and platform, as the commit page does.</div>`;
  } else {
    const st = S.stream, g = groupOf(st.gid), gi = GROUPS.indexOf(g);
    const done = Object.values(RUNS).filter(x => x.status === "done");
    const stage = st.io === "in" ? gi : gi + 1;
    const spec = { a: { run: st.a, stage }, b: { run: st.b, stage }, split: st.split, stream: st.io === "in" ? "out" : st.s, gid: g.id };
    const sameA = lineage(st.a).length, cachedNote = (() => {
      const ancA = new Set(lineage(st.a).map(x => x.id)), ancB = lineage(st.b);
      const common = ancB.slice().reverse().find(x => ancA.has(x.id));
      const pa = patchOf(st.a), pb = patchOf(st.b);
      const diffKeys = [...new Set([...Object.keys(pa), ...Object.keys(pb)])].filter(k => !eq(pa[k], pb[k]));
      const fc = diffKeys.length ? Math.min(...diffKeys.map(k => PARAM[k].gi)) : GROUPS.length;
      return fc >= stage ? `These two runs have the same parameters up to this point: the images are identical (${runLabel(st.a)} and ${runLabel(st.b)} share ${common ? runLabel(common.id) : "no run"}).` : `They first differ at <b>${esc(GROUPS[fc].name)}</b>.`;
    })();
    body = `<div style="padding:8px 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <label class="small">${SCHEMA.group_label} <select id="st-g">${GROUPS.map(x => `<option value="${x.id}" ${x.id === st.gid ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></label>
        <span class="btn-group"><button class="btn small ${st.io === "in" ? "on" : ""}" data-act="st-io" data-v="in">input</button><button class="btn small ${st.io === "out" ? "on" : ""}" data-act="st-io" data-v="out">output</button></span>
        ${st.io === "out" ? `<label class="small">stream <select id="st-s">${g.streams.map(s => `<option ${s === st.s ? "selected" : ""}>${s}</option>`).join("")}</select></label>` : ""}
        <label class="small">left <select id="st-a">${done.map(x => `<option value="${x.id}" ${x.id === st.a ? "selected" : ""}>${runLabel(x.id)}</option>`).join("")}</select></label>
        <label class="small">right <select id="st-b">${done.map(x => `<option value="${x.id}" ${x.id === st.b ? "selected" : ""}>${runLabel(x.id)}</option>`).join("")}</select></label>
        <span class="small muted">${cachedNote}</span></div>
      <div style="padding:0 10px 10px"><div class="viewer-wrap"><canvas data-img='${JSON.stringify(spec)}' aria-label="Stream comparison"></canvas>
        <div class="split-line" style="left:${st.split}%"></div><span class="lbl" style="left:4px">${runLabel(st.a)}</span><span class="lbl" style="right:4px">${runLabel(st.b)}</span></div>
        <input type="range" id="st-split" min="0" max="100" value="${st.split}" aria-label="Split position" style="width:100%"></div>`;
  }
  return `<div class="card">
    <div class="panel-h" style="font-weight:400"><b>${runLabel(S.sel)}</b>${statusTag(r)}${r.note ? `<span>${esc(r.note)}</span>` : ""}<span class="muted small">run ${r.run_id} · ${r.by} · ${r.at}${r.status === "done" ? ` · ${secs(tot)}` : ""}</span><span class="grow"></span>
      <button class="btn small" data-act="pin">${r.pinned ? "📌 Unpin" : "📌 Pin"}</button>
      <button class="btn small" data-act="writeback" ${r.parent ? "" : "disabled"}>Write back to config…</button>
      <button class="btn small primary" data-act="tweak-from" data-run="${S.sel}" ${r.status === "done" ? "" : "disabled"}>✎ Tweak from ${runLabel(S.sel)}</button></div>
    <div style="display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--qa-border);flex-wrap:wrap">
      <span class="small muted">Compare with</span>
      <span class="btn-group"><button class="btn small ${S.diffAgainst === "parent" ? "on" : ""}" data-act="against" data-v="parent" ${r.parent ? "" : "disabled"}>parent${r.parent ? ` ${runLabel(r.parent)}` : ""}</button><button class="btn small ${S.diffAgainst === "root" ? "on" : ""}" data-act="against" data-v="root">#0 root</button><button class="btn small ${S.diffAgainst === "milestone" ? "on" : ""}" data-act="against" data-v="milestone">milestone</button></span>
      ${S.diffAgainst === "milestone" ? `<select id="mspick" aria-label="Milestone">${MILESTONES.map(x => `<option value="${x.id}" ${x.id === S.milestone ? "selected" : ""}>⚑ ${esc(x.label)} (${x.commit})</option>`).join("")}</select>` : ""}
      <span style="flex:1"></span>
      ${m ? METRICS.slice(0, 3).map(mm => `<span class="small"><span class="muted">${mm.label}</span> <span class="mono">${mm.fmt(m[mm.k])}</span> ${delta(mm, m[mm.k], ag.metrics[mm.k])}</span>`).join(" ") : ""}
    </div>
    <div class="tabs" style="padding:0 6px;margin:0">${tabs.map(([k, l]) => `<a class="${S.tab === k ? "on" : ""}" data-act="tab" data-v="${k}">${l}</a>`).join("")}</div>
    ${body}
  </div>`;
}

function viewSession() {
  const running = Object.values(RUNS).filter(r => r.status === "running");
  return `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
      <h2 style="margin:0;font-size:16px">${esc(SESSION.name)}</h2><span class="tag mono">${SESSION.batch}</span>
      <span class="muted small">${INPUT} · linux · base + outdoor · commit ${COMMIT.id}</span><span style="flex:1"></span>
      ${running.length ? `<span class="small muted">${running.length} running · you'll get a notification when ${running.length > 1 ? "they end" : "it ends"}</span>` : ""}
      <button class="btn small" data-act="tweak-from" data-run="${S.base}">✎ Back to tweaking ${runLabel(S.base)}</button></div>
    <div class="session">${treePanel()}${detailPanel()}</div>`;
}

// Write back dialog
// ---------------------------------------------------------------------------------------------------------------------
function dialog() {
  if (S.dialog !== "writeback") return "";
  const patch = patchOf(S.sel), keys = Object.keys(patch);
  const target = S.wbTarget || "configs/outdoor.yaml";
  const lines = [];
  GROUPS.forEach(g => {
    const ks = keys.filter(k => PARAM[k].group === g.id); if (!ks.length) return;
    lines.push(`  ${g.id}:`);
    ks.forEach(k => { const cv = CONFIG_VALUES[k]; if (cv && cv.src === target) lines.push(`<span class="diff-del">-    ${PARAM[k].k}: ${esc(fmtV(cv.v))}</span>`); lines.push(`<span class="diff-add">+    ${PARAM[k].k}: ${esc(fmtV(patch[k]))}</span>`); });
  });
  return `<div class="dialog-bg" data-act="close-bg"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="wb-t">
    <div class="panel-h" id="wb-t">Write ${runLabel(S.sel)}'s parameters to a configuration file<span class="grow"></span><button class="btn minimal small" data-act="close" aria-label="Close">✕</button></div>
    <div class="body">
      <div class="small">${keys.length} parameters differ from the run's configurations. QA-Board doesn't change your repository: it gives you the change to apply, and checks it would reproduce ${runLabel(S.sel)}.</div>
      <label class="small">Target <select id="wb-target"><option ${target === "configs/outdoor.yaml" ? "selected" : ""}>configs/outdoor.yaml</option><option ${target === "configs/base.yaml" ? "selected" : ""}>configs/base.yaml</option><option ${target === "new file" ? "selected" : ""} value="new file">a new file: configs/tweaks/s14-r${RUNS[S.sel].n}.yaml</option></select></label>
      <pre>--- a/${target === "new file" ? "/dev/null" : target}  (at ${COMMIT.id})
+++ b/${target === "new file" ? `configs/tweaks/s14-r${RUNS[S.sel].n}.yaml` : target}
@@ isp: @@
${lines.join("\n")}</pre>
      <div class="callout warning small"><span>⚠</span><span>Your branch has 2 commits after ${COMMIT.id}; one changes <span class="mono">${target === "new file" ? "configs/base.yaml" : target}</span>. The patch may not apply: <span class="mono">qa apply-tweak</span> tells you.</span></div>
      <pre>qa apply-tweak ${RUNS[S.sel].run_id} --to ${target === "new file" ? `configs/tweaks/s14-r${RUNS[S.sel].n}.yaml` : target}</pre>
    </div>
    <div class="foot"><button class="btn" data-act="close">Cancel</button><button class="btn" data-act="copy-cmd">Copy command</button><button class="btn primary" data-act="copy-diff">Copy diff</button></div>
  </div></div>`;
}

const content = document.getElementById("content");
function render() {
  document.getElementById("navbar").innerHTML = navbar();
  content.innerHTML = { run: viewRun, tweak: viewTweak, session: viewSession }[S.view]();
  document.getElementById("overlay").innerHTML = dialog();
  document.getElementById("nav-run").classList.toggle("on", S.view === "run");
  document.getElementById("nav-session").classList.toggle("on", S.view !== "run");
  drawCanvases(document.body);
  if (S.qOpen) { const q = document.getElementById("regsearch"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
}
// Partial refresh while dragging a slider: keep focus, update the chain badges and the pending bar
function refreshPending() {
  const pend = document.querySelector(".pending"); if (pend) pend.outerHTML = pendingBar();
  const chain = document.querySelector(".tweak > .card:first-child"); if (chain) chain.outerHTML = chainPanel();
  document.querySelectorAll(".regs tr").forEach(tr => { const k = tr.id.replace("row-", "").replace("-", "."); tr.classList.toggle("mod", k in S.pending); });
}
function go(view) { S.view = view; S.livePop = false; try { history.replaceState(null, "", "#" + view); } catch (e) { location.hash = view; } render(); content.scrollTop = 0; }

function setReg(key, raw, idx) {
  const p = PARAM[key];
  let v;
  if (p.t === "bool") v = !!raw;
  else if (p.t === "int") v = Math.round(+raw);
  else if (p.t === "float") v = +(+raw).toFixed(4);
  else if (p.t === "enum") v = raw;
  else { const cur = valueOf(S.base, key, S.pending).v.slice(); cur[idx] = p.t === "int[]" ? Math.round(+raw) : +raw; v = cur; }
  if ((p.t === "int" || p.t === "float") && (Number.isNaN(v) || v < p.min || v > p.max)) return false;
  if (eq(v, valueOf(S.base, key).v)) delete S.pending[key]; else S.pending[key] = v;
  return true;
}

document.addEventListener("click", e => {
  const goEl = e.target.closest("[data-go]");
  if (goEl) { e.preventDefault(); go(goEl.dataset.go); return; }
  const el = e.target.closest("[data-act]");
  if (!el) { if (S.qOpen && !e.target.closest(".search-wrap")) { S.qOpen = false; render(); } return; }
  const a = el.dataset.act;
  if (a === "close-bg" && e.target !== el) return;
  switch (a) {
    case "tweak-from": {
      const id = el.dataset.run;
      if (id !== S.base && Object.keys(S.pending).length) toast(`Your ${Object.keys(S.pending).length} pending change(s) now apply on top of ${runLabel(id)}.`);
      S.base = id; S.outCompare = "parent";
      if (el.dataset.input && el.dataset.input !== "0") toast("Mock-up: every card opens the same fake session.");
      go("tweak"); break;
    }
    case "group": S.group = el.dataset.g; S.qOpen = false; render(); break;
    case "jump": { const p = PARAM[el.dataset.key]; S.group = p.group; S.q = ""; S.qOpen = false; S.flash = p.key; render(); document.getElementById(`row-${p.key.replace(".", "-")}`)?.scrollIntoView({ block: "center" }); setTimeout(() => { S.flash = null; }, 1300); break; }
    case "reset": { const k = el.dataset.key; if (k in S.pending) delete S.pending[k]; else { S.pending[k] = PARAM[k].d; if (eq(PARAM[k].d, valueOf(S.base, k).v)) delete S.pending[k]; } render(); break; }
    case "discard": S.pending = {}; S.showPatch = false; render(); break;
    case "showpatch": S.showPatch = !S.showPatch; render(); break;
    case "outcmp": S.outCompare = el.dataset.v; render(); break;
    case "launch": launch(); break;
    case "branch-pick": go("session"); toast("Pick a run in the tree, then ✎ Tweak from it."); break;
    case "sel": S.sel = el.dataset.run; if (!RUNS[S.sel].parent && S.diffAgainst === "parent") S.diffAgainst = "root"; render(); break;
    case "tab": S.tab = el.dataset.v; render(); break;
    case "against": S.diffAgainst = el.dataset.v; if (S.tab === "streams" || S.tab === "blocks") S.tab = "params"; render(); break;
    case "pin": RUNS[S.sel].pinned = !RUNS[S.sel].pinned; toast(RUNS[S.sel].pinned ? `${runLabel(S.sel)} pinned: kept when the session is cleaned up.` : `${runLabel(S.sel)} unpinned.`); render(); break;
    case "writeback": S.dialog = "writeback"; render(); break;
    case "close": case "close-bg": S.dialog = null; render(); break;
    case "copy-diff": case "copy-cmd": {
      const txt = a === "copy-cmd" ? `qa apply-tweak ${RUNS[S.sel].run_id}` : JSON.stringify(patchOf(S.sel), null, 2);
      navigator.clipboard?.writeText(txt).then(() => toast("Copied."), () => toast("Couldn't copy: select the text instead."));
      break;
    }
    case "livepop": S.livePop = !S.livePop; render(); break;
    case "st-io": S.stream.io = el.dataset.v; render(); break;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (S.dialog) { S.dialog = null; render(); } else if (S.qOpen) { S.qOpen = false; render(); } else if (S.livePop) { S.livePop = false; render(); } }
  if (e.key === "/" && S.view === "tweak" && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); S.qOpen = true; render(); }
  if (e.key === "Enter" && e.target.matches("[data-act=group], [data-act=sel]")) e.target.click();
  if (e.target.id === "regsearch") {
    const res = searchResults();
    if (e.key === "ArrowDown") { S.qIndex = Math.min(res.length - 1, S.qIndex + 1); e.preventDefault(); render(); }
    if (e.key === "ArrowUp") { S.qIndex = Math.max(0, S.qIndex - 1); e.preventDefault(); render(); }
    if (e.key === "Enter" && res[S.qIndex]) { document.querySelector(`.suggest [data-key="${res[S.qIndex].key}"]`)?.click(); }
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "regsearch") { S.q = t.value; S.qOpen = true; S.qIndex = 0; render(); return; }
  if (t.id === "splitter") { S.split = +t.value; const wrap = t.previousElementSibling; const spec = JSON.parse(wrap.querySelector("canvas").dataset.img); spec.split = S.split; wrap.querySelector("canvas").dataset.img = JSON.stringify(spec); wrap.querySelector(".split-line").style.left = S.split + "%"; drawCanvases(wrap); return; }
  if (t.id === "st-split") { S.stream.split = +t.value; const wrap = t.previousElementSibling; const spec = JSON.parse(wrap.querySelector("canvas").dataset.img); spec.split = S.stream.split; wrap.querySelector("canvas").dataset.img = JSON.stringify(spec); wrap.querySelector(".split-line").style.left = S.stream.split + "%"; drawCanvases(wrap); return; }
  if (t.dataset.reg && (t.type === "range" || t.type === "number")) {
    if (t.dataset.i != null) return; // arrays: on change
    if (setReg(t.dataset.reg, t.value)) { const pair = document.getElementById(t.dataset.pair); if (pair) pair.value = t.value; refreshPending(); }
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.reg) {
    if (t.type === "checkbox") setReg(t.dataset.reg, t.checked);
    else if (t.dataset.i != null) setReg(t.dataset.reg, t.value, +t.dataset.i);
    else if (!setReg(t.dataset.reg, t.value)) { toast(`${t.dataset.reg} must be between ${PARAM[t.dataset.reg].min} and ${PARAM[t.dataset.reg].max}.`); }
    render(); return;
  }
  const map = { modonly: () => S.modifiedOnly = t.checked, basepick: () => { S.base = t.value; }, mspick: () => S.milestone = t.value,
    "st-g": () => { S.stream.gid = t.value; S.stream.s = "out"; }, "st-s": () => S.stream.s = t.value, "st-a": () => S.stream.a = t.value, "st-b": () => S.stream.b = t.value,
    "wb-target": () => S.wbTarget = t.value };
  if (map[t.id]) { map[t.id](); render(); }
});

// Launch: a child run of the base, with the pending patch. Its blocks finish at a sped-up pace.
let nextN = 6;
function launch() {
  const id = `r${nextN}`, parent = S.base;
  const own = { ...S.pending };
  RUNS[id] = { id, n: nextN, parent, own, status: "running", at: `10:${30 + nextN}`, by: "you", note: "", run_id: 48244 + nextN, progress: 0 };
  nextN++;
  S.pending = {}; S.showPatch = false; S.sel = id; S.tab = "blocks"; S.diffAgainst = "parent";
  S.stream = { ...S.stream, gid: S.group, a: parent, b: id };
  toast(`Started ${runLabel(id)}: child of ${runLabel(parent)}, ${Object.keys(own).length} change(s).`);
  go("session");
  animate(id, 4);
}
function animate(id, speed) {
  const tot = total(timingsOf(id));
  const tick = () => {
    const r = RUNS[id]; if (!r || r.status !== "running") return;
    r.progress = Math.min(1, r.progress + (0.5 * speed) / tot);
    if (r.progress >= 1) { r.status = "done"; r.progress = 1; toast(`${runLabel(id)} is done (${secs(tot)}).`); if (S.view === "session" && S.sel === id) S.tab = S.tab === "blocks" ? "metrics" : S.tab; }
    // don't close a select or steal focus while someone uses the page
    const busy = /SELECT|INPUT/.test(document.activeElement?.tagName || "");
    if (S.view === "session" && !S.dialog && (!busy || r.status === "done")) render();
    if (r.status === "running") setTimeout(tick, 500);
  };
  setTimeout(tick, 500);
}
animate("r5", 1);

const initial = (location.hash || "").replace("#", "");
S.view = ["run", "tweak", "session"].includes(initial) ? initial : "run";
render();
</script>
