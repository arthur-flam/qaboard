# https://uwsgi-docs.readthedocs.io/en/latest/ThingsToKnow.html
# https://pythonise.com/series/learning-flask/python-flask-uwsgi-introduction
# https://uwsgi-docs.readthedocs.io/en/latest/ConfigLogic.html
# https://www.techatbloomberg.com/blog/configuring-uwsgi-production-deployment/

# Comments must be on their own line: uwsgi has no inline comments, `key = value  # text` sets the value to
# "value  # text". Numbers still parse (the text after them is ignored), and so do booleans (anything but
# "false/off/no/0" is true), but e.g. `need-app = false ; ...` would be true, and strings would be wrong.
# Note: uwsgi also reads options from UWSGI_* environment variables (UWSGI_RELOAD_ON_RSS sets reload-on-rss),
# before this file: an option set here wins, unless it's in an `if-env` block for that variable after it.

[uwsgi]
; FIXME: why do we need this? it complained about "listen" from the CLI not being OK...
; it means: Fail to start if unknown config parameter found
; strict = true

protocol = uwsgi

master = true
module = backend:app
; Fail to start if application cannot load
need-app = true

processes = 1
if-env = UWSGI_PROCESSES
processes = $(UWSGI_PROCESSES)
# Each process gets multiple threads to handle concurrency
threads = 4
endif =

; the root user has this setup already
; but we might be runner as a different user...
env = LANG=C.utf8
env = LC_ALL=C.UTF-8
env = LC_LANG=C.UTF-8
env = PYTHONIOENCODING=UTF-8

; https://uwsgi-docs.readthedocs.io/en/latest/Cheaper.html#:~:text=To%20enable%20cheaper%20mode%20add,(%20workers%20or%20processes%20option).
if-env = UWSGI_CHEAPER_ALGO_BUSYNESS
cheaper-algo = busyness
; Maximum number of workers allowed
processes = $(UWSGI_PROCESSES)
; Minimum number of workers allowed
cheaper = $(UWSGI_CHEAPER)
; Workers created at startup
cheaper-initial = $(UWSGI_CHEAPER_INITIAL)
; Length of a cycle in seconds
cheaper-overload = $(UWSGI_CHEAPER_OVERLOAD)
; How many workers to spawn at a time
cheaper-step = 16
; How many cycles to wait before killing workers
cheaper-busyness-multiplier = 30
; Below this threshold, kill workers (if stable for multiplier cycles)
cheaper-busyness-min = 20
; Above thiss threshold, spawn new workers
cheaper-busyness-max = 70
; Spawn emergency workers if more than this many requests are waiting in the queue
cheaper-busyness-backlog-alert = 16
; How many emergegency workers to create if there are too many requests in the queue
cheaper-busyness-backlog-step = 2

# if-env = UWSGI_CHEAPER_RSS_LIMIT_SOFT
# soft limit will prevent cheaper from spawning new workers if workers total rss memory is equal or higher (values are in bytes)
cheaper-rss-limit-soft = $(UWSGI_CHEAPER_RSS_LIMIT_SOFT)
# endif =

# if-env = UWSGI_CHEAPER_RSS_LIMIT_HARD
# hard limit will force cheaper to cheap single worker if workers total rss memory is equal or higher (values are in bytes)
cheaper-rss-limit-hard = $(UWSGI_CHEAPER_RSS_LIMIT_HARD)
# endif =


endif =

if-env = UWSGI_UID
uid = %(_)
endif =
if-env = UWSGI_GID
gid = uucp
endif =

# **Queue & Load Management**
# Increase socket backlog queue
listen = 1024
# Enable TCP keepalive
so-keepalive = true
# Timeout if a request takes too long
socket-timeout = 180
# Buffer large POST requests (reduce worker blocking)
post-buffering = 8192
# Kill slow HTTP connections
http-timeout = 180
# Avoid SIGPIPE errors from client disconnects
ignore-sigpipe = true
# we need to increase it a bit from the 4096 default
# https://stackoverflow.com/questions/15878176/uwsgi-invalid-request-block-size
# Allow larger request headers
buffer-size = 32768


# use a port
socket = :3000
# Plain HTTP, used for healthchecks (/api/v1/health) and debugging without nginx
http-socket = :3001
chmod-socket = 666
# removes the socket when the process stops
vacuum = true
# well-behaved when running with an init system like systemd
; shutdown when reciving SIGTERM
die-on-term = true
# ...gracefully: finish in-flight requests (up to worker-reload-mercy) before exiting, for zero-downtime deploys
hook-master-start = unix_signal:15 gracefully_kill_them_all

# if ever need threads
enable-threads = true
;thread-stacksize = 512

# https://github.com/unbit/uwsgi/issues/1978
; py-call-osafterfork = true ; allows workers to receive signals.


if-env = UWSGI_STATS
memory-report = true
stats = /tmp/stats.sock
# we could also do...
# stats = 127.0.0.1:3001
endif =

single-interpreter = true

# timeout to kill requests
harakiri = 300

; disable-logging = true
; log-4xx = true
; log-5xx = true

# Worker Recycling
; Restart workers after this many requests
max-requests = 1000
; avoid reload of workers simultaneously
max-requests-delta = 100
; Restart workers after this many seconds
max-worker-lifetime = 3600
; avoid respawn of workers at the same time
max-worker-lifetime-delta = 15
; Restart workers after this much resident memory (MB), after their current request. It's cheap: they are forked
; from the master, which loaded the app. Workers use 0.5-1.5GB, but grow after some big requests and keep that memory
reload-on-rss = 2048
if-env = UWSGI_RELOAD_ON_RSS
reload-on-rss = %(_)
endif =
; how long to wait before forcefully killing workers
worker-reload-mercy = 30
; Prevents multiple workers from grabbing the same request
thunder-lock = true

# Process Labeling
auto-procname = true
