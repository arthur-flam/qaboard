available_metrics:
  psnr:
    label: PSNR
    short_label: PSNR
    description: Peak signal-to-noise ratio of the denoised image against the ground truth.
    suffix: dB
    target: 25
    smaller_is_better: false
  psnr_gain:
    label: PSNR gain
    short_label: Gain
    description: How much the denoiser improved the PSNR of the noisy input.
    suffix: dB
    target: 5
    smaller_is_better: false
  runtime:
    label: Runtime
    short_label: Time
    description: Time spent denoising.
    suffix: s
    smaller_is_better: true
    plot_scale: linear
  is_failed:
    label: Crashed
    short_label: Crashed
    description: This run crashed.
    scale: 100
    suffix: "%"
    target: 0
    smaller_is_better: true
    plot_scale: linear

default_metric: psnr
summary_metrics:
  - psnr
  - psnr_gain
  - runtime
main_metrics:
  - psnr
  - psnr_gain
  - runtime
