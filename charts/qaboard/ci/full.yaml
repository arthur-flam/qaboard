# Used by CI to validate the templates: every option enabled
image:
  repository: registry.example.com/qaboard
  version: 1a2b3c4d
imagePullSecrets: [{name: registry}]
database:
  cnpg:
    enabled: true
secret:
  values:
    GITLAB_ACCESS_TOKEN: xxx
backend:
  autoscaling:
    enabled: true
  extraVolumes:
    - name: algo
      nfs: {server: nas.example.com, path: /algo}
  extraVolumeMounts:
    - {name: algo, mountPath: /algo}
proxy:
  siteConfig:
    extra.conf: |
      server { listen 8080; }
ingress:
  className: nginx
  tls: [{secretName: qaboard-tls}]
cantaloupe:
  enabled: true
celery:
  enabled: true
# Prometheus: the ServiceMonitors (backend, flower), the alerts, the dashboard, with a token
metrics:
  enabled: true
  token: true
  serviceMonitor:
    enabled: true
    namespace: monitoring
    labels: {release: kube-prometheus-stack}
    metricRelabelings:
      - {sourceLabels: [route], regex: /metrics, action: drop}
  prometheusRule:
    enabled: true
    labels: {release: kube-prometheus-stack}
  dashboard:
    enabled: true
    annotations: {grafana_folder: QA-Board}
mcp:
  enabled: true
  replicas: 2
backup:
  enabled: true
# A new PersistentVolumeClaim, next to the extraVolumes above
results:
  enabled: true
  storageClass: nfs
# Start and stop runs on Kubernetes, in two namespaces
runners:
  kubernetes:
    enabled: true
    namespaces: [algo-qa, algo-gpu]
    allowHostPath: true
    allowRunAsImage: true
    runAs: "5000:5000"
    dask: true
    extraRules:
      - apiGroups: [""]
        resources: [persistentvolumeclaims]
        verbs: [get]
