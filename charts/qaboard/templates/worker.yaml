{{- if .Values.worker.enabled }}
# Runs the backend's background tasks (backend/backend/tasks.py), with the backend's image, configuration and storage
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qaboard.fullname" . }}-worker
  labels: {{- include "qaboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: {{- include "qaboard.selectorLabels" (list . "worker") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "qaboard.selectorLabels" (list . "worker") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      # Running tasks finish before the worker stops (celery's warm shutdown on SIGTERM)
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: {{ include "qaboard.image" (list . "backend") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["./wait-for-it.sh", "{{ include "qaboard.dbHost" . }}:{{ .Values.database.port }}", "-t", "0", "--", "/qaboard/backend/worker.sh"]
          {{- with .Values.backend.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom: {{- include "qaboard.backendEnvFrom" . | nindent 12 }}
          env: {{- include "qaboard.backendEnv" . | nindent 12 }}
            - name: QABOARD_WORKER_CONCURRENCY
              value: {{ .Values.worker.concurrency | quote }}
          # Restarts it if it can't reach the queue anymore
          livenessProbe:
            exec: {command: ["python", "/qaboard/backend/worker_healthcheck.py"]}
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 3
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/qaboard}
            {{- with .Values.backend.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.backend.data.existingClaim | default (printf "%s-data" (include "qaboard.fullname" .)) }}
        {{- with .Values.backend.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
